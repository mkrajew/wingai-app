services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - ./backend/models:/app/backend/models:ro
    environment:
      WINGAI_PRECISE_MODEL: ${WINGAI_PRECISE_MODEL:-precise.ckpt}
      WINGAI_ROTATION_MODEL: ${WINGAI_ROTATION_MODEL:-rotation.ckpt}
      WINGAI_MEAN_SHAPE: ${WINGAI_MEAN_SHAPE:-mean_shape.pth}

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${WINGAI_HTTP_BIND:-127.0.0.1}:${WINGAI_HTTP_PORT:-8080}:80"
    volumes:
      - "${WINGAI_NGINX_CONF:-./nginx.conf}:/etc/nginx/nginx.conf:ro"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
